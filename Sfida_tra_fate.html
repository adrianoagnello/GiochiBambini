<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sfida tra Fate">
<title>Sfida tra Fate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Concetto: schermo di gioco 16:9 al centro su sfondo notte, comandi touch sovrapposti in basso.
   Look unico e scuro per scelta: il gioco ha i suoi colori in ogni tema. */
:root{
  --notte:#150f2b; --carta:#fff6e0; --rosa:#ff7ab8; --oro:#ffc83d; --prugna:#3b1d63;
  --font:'Baloo 2','Trebuchet MS','Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--notte); color:var(--carta); font-family:var(--font);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  -webkit-user-select:none; user-select:none; touch-action:none; -webkit-touch-callout:none;
}
#stage{position:relative; --u:1; width:960px; height:540px; border-radius:14px; overflow:hidden; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.5)}
#c{display:block; width:100%; height:100%}
#snd{position:absolute; top:calc(var(--u)*12px); right:calc(var(--u)*12px); font:700 calc(var(--u)*15px)/1 var(--font); color:var(--carta);
  background:rgba(20,10,40,.55); border:1.5px solid rgba(255,255,255,.35); border-radius:999px; padding:calc(var(--u)*8px) calc(var(--u)*14px); cursor:pointer}
#touch{position:absolute; left:0; right:0; bottom:0; padding:0 3% 3%; display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none}
#stage:not([data-mode="play"]) #touch{display:none}
#touch button{pointer-events:auto; touch-action:none; -webkit-touch-callout:none; font-family:var(--font); font-weight:800; color:#fff;
  width:max(60px,calc(var(--u)*88px)); height:max(60px,calc(var(--u)*88px)); border-radius:50%; font-size:calc(var(--u)*32px);
  background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.65); cursor:pointer}
#touch button.on{background:rgba(255,200,61,.7); border-color:#fff}
#touch .grp{display:flex; gap:calc(var(--u)*16px); align-items:flex-end}
#touch .col{display:flex; flex-direction:column; gap:calc(var(--u)*10px)}
#touch .col button{width:max(52px,calc(var(--u)*70px)); height:max(52px,calc(var(--u)*70px)); font-size:calc(var(--u)*26px)}
#touch .big{width:max(80px,calc(var(--u)*128px)); height:max(80px,calc(var(--u)*128px)); font-size:calc(var(--u)*22px); background:rgba(255,122,184,.4)}
#menu{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(21,15,43,.55)}
.mcard{width:min(88%,calc(var(--u)*660px)); text-align:center; background:rgba(38,20,70,.9); border:2px solid rgba(255,200,61,.6);
  border-radius:calc(var(--u)*24px); padding:calc(var(--u)*20px) calc(var(--u)*26px)}
.mcard h1{margin:0 0 .15em; font-size:calc(var(--u)*38px); line-height:1.05; color:var(--oro); text-wrap:balance; font-weight:800}
.mcard p{margin:.3em 0; font-size:calc(var(--u)*18px); line-height:1.3; text-wrap:balance}
.mcard .hint{font-size:calc(var(--u)*15px); opacity:.8}
.cta{font:800 calc(var(--u)*28px)/1 var(--font); color:#3a2200; background:var(--oro); border:0; border-radius:999px;
  padding:calc(var(--u)*12px) calc(var(--u)*40px); margin:calc(var(--u)*10px) 0 calc(var(--u)*6px); cursor:pointer}
.lv{display:flex; gap:calc(var(--u)*10px); align-items:center; justify-content:center; font-size:calc(var(--u)*16px)}
.lv button{font:800 calc(var(--u)*18px)/1 var(--font); width:calc(var(--u)*40px); height:calc(var(--u)*40px); border-radius:50%;
  color:var(--carta); background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.5); cursor:pointer}
.lv2{margin-top:calc(var(--u)*8px)}
#mEasy{font:800 calc(var(--u)*16px)/1 var(--font); color:var(--carta); background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.5); border-radius:999px; padding:calc(var(--u)*9px) calc(var(--u)*18px); cursor:pointer}
#mEasy[aria-pressed="true"]{background:#6fd16f; color:#12310f; border-color:#fff}
button:focus-visible{outline:3px solid #fff; outline-offset:2px}
#rotate{display:none}
@media (orientation:portrait){
  #rotate{display:block; position:fixed; top:6px; left:0; right:0; text-align:center; font-size:14px; color:var(--oro); z-index:5}
}
</style>
</head>
<body>
<div id="rotate">Gira il dispositivo in orizzontale per giocare meglio</div>
<div id="stage" data-mode="intro">
  <canvas id="c" width="960" height="540"></canvas>
  <button id="snd" type="button" aria-pressed="false">Suono: sì</button>
  <div id="touch" hidden>
    <div class="grp l">
      <button type="button" data-k="left" aria-label="Sinistra">&#9664;</button>
      <button type="button" data-k="right" aria-label="Destra">&#9654;</button>
    </div>
    <div class="grp r">
      <div class="col" id="climb" hidden>
        <button type="button" data-k="up" aria-label="Su">&#9650;</button>
        <button type="button" data-k="down" aria-label="Giù">&#9660;</button>
      </div>
      <button type="button" data-k="jump" class="big">SALTA</button>
    </div>
  </div>
  <div id="menu" hidden>
    <div class="mcard">
      <h1 id="mTitle">Sfida tra Fate</h1>
      <p id="mText"></p>
      <button type="button" class="cta" id="mPlay">Gioca</button>
      <div class="lv"><span>Vai al livello</span>
        <button type="button" data-lv="1">1</button><button type="button" data-lv="2">2</button><button type="button" data-lv="3">3</button>
      </div>
      <div class="lv2"><button type="button" id="mEasy" aria-pressed="false">Allenamento: no</button></div>
      <p class="hint" id="mHint">Frecce o A D per muoverti, Spazio per saltare. Salta due volte per volare più in alto e tieni premuto per planare.</p>
    </div>
  </div>
</div>

function fit(){
  const rs=getComputedStyle(document.documentElement), bs=getComputedStyle(document.body);
  const aw=window.innerWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight);
  const ah=window.innerHeight-parseFloat(rs.paddingTop)-parseFloat(rs.paddingBottom);
  const sc=Math.max(0.3,Math.min(aw/VW,ah/VH));
  SCREEN_SCALE=sc;
  stage.style.width=Math.floor(VW*sc)+'px'; stage.style.height=Math.floor(VH*sc)+'px';
  stage.style.setProperty('--u',sc.toFixed(3));
  const r=Math.max(1,Math.min(2.5,sc*(window.devicePixelRatio||1)));
  cv.width=Math.round(VW*r); cv.height=Math.round(VH*r); ctx.setTransform(r,0,0,r,0,0);
}
addEventListener('resize',fit);

const keys={}, pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',Enter:'ok',NumpadEnter:'ok',Digit1:'a1',Digit2:'a2',Digit3:'a3',Numpad1:'a1',Numpad2:'a2',Numpad3:'a3'};
function press(k){ if(!keys[k]) pressed[k]=true; keys[k]=true; }
function release(k){ keys[k]=false; }
addEventListener('keydown',e=>{ const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); audioInit(); press(k); });
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k){ e.preventDefault(); release(k); } });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); audioInit(); press(k); b.classList.add('on'); });
  const up=()=>{ release(k); b.classList.remove('on'); };
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
});
let lastTap=null;
cv.addEventListener('pointerdown',e=>{
  audioInit(); pressed.ok=true;
  const b=cv.getBoundingClientRect();
  lastTap={x:(e.clientX-b.left)*VW/b.width, y:(e.clientY-b.top)*VH/b.height};
});
const coarse=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
touchEl.hidden=!coarse;
addEventListener('touchstart',()=>{ touchEl.hidden=false; },{once:true,passive:true});

/* ----- suoni (generati nel browser) ----- */
let AC=null, muted=false;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; }
}
function tone(f,d,type,vol,slide,delay){
  if(!AC||muted) return;
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.03);
}
const SFX={
  jump:()=>tone(520,.14,'triangle',.07,300),
  flap:()=>{ tone(700,.09,'sine',.05,250); tone(900,.09,'sine',.04,200,.05); },
  fruit:()=>{ tone(784,.1,'triangle',.08); tone(1175,.18,'triangle',.08,0,.08); },
  hurt:()=>tone(320,.35,'sawtooth',.06,-220),
  check:()=>{ tone(660,.12,'sine',.07); tone(880,.22,'sine',.07,0,.1); },
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.08,0,i*.13)),
  crumble:()=>tone(130,.25,'square',.04,-70),
  fire:()=>tone(100,.45,'sawtooth',.05,-40),
  vine:()=>tone(420,.05,'square',.02)
};

/* ----- utilità ----- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rnd(i){ const s=Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function hit(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const FONT="'Baloo 2','Trebuchet MS',sans-serif";
function txt(g,s,x,y,size,col,align,weight){
  g.font=(weight||800)+' '+size+'px '+FONT; g.textAlign=align||'center'; g.textBaseline='middle';
  g.lineJoin='round'; g.lineWidth=Math.max(3,size*0.16); g.strokeStyle='rgba(30,10,50,.85)'; g.strokeText(s,x,y);
  g.fillStyle=col||'#fff'; g.fillText(s,x,y);
}
function wrap(g,s,x,y,maxW,lh,size,col){
  g.font='800 '+size+'px '+FONT;
  const words=s.split(' '); let line='', yy=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(g.measureText(test).width>maxW&&line){ txt(g,line,x,yy,size,col); line=w; yy+=lh; } else line=test;
  }
  txt(g,line,x,yy,size,col); return yy;
}

/* ----- particelle ----- */
const parts=[];
function emit(x,y,n,col,spd,life,grav){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, s=Math.random()*(spd||2);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.5,l:(life||30)*(0.6+Math.random()*0.6),m:life||30,c:col,r:1.5+Math.random()*2.5,g:grav===undefined?0.05:grav});
  }
}
function updParts(){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.l--; if(p.l<=0) parts.splice(i,1); }
}
function drawParts(g,cx,cy){
  for(const p of parts){ g.globalAlpha=Math.max(0,p.l/p.m); g.fillStyle=p.c; g.beginPath(); g.arc(p.x-cx,p.y-cy,p.r,0,6.283); g.fill(); }
  g.globalAlpha=1;
}

/* ===== Grafica: personaggi e oggetti (disegnati in codice) =====
   Per usare le tue immagini: metti un indirizzo (o data URI) in ASSETS, per esempio ASSETS.fata.
   Le immagini vengono ancorate ai piedi del personaggio. */
const ASSETS={fata:'',fataCattiva:'',drago:'',gufo:''};
const IMG={};
for(const k in ASSETS){ if(ASSETS[k]){ const im=new Image(); im.onload=()=>{ IMG[k]=im; }; im.src=ASSETS[k]; } }
function drawSprite(g,name,x,y,h,flip){
  const im=IMG[name]; if(!im) return false;
  const w=im.width*h/im.height; g.save(); g.translate(x,y); g.scale(flip,1); g.drawImage(im,-w/2,-h,w,h); g.restore(); return true;
}
function star(g,x,y,r,col){
  g.fillStyle=col; g.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*0.45:r; g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q); }
  g.closePath(); g.fill();
}

/* ===== Grafica: sfondi, terreno, ostacoli ===== */
function hills(g,px,py,col,base,amp,freq,seed){
  g.fillStyle=col; g.beginPath(); g.moveTo(0,VH);
  for(let x=0;x<=VW+24;x+=24){ const wx=x+px; g.lineTo(x,base-py+Math.sin(wx*freq+seed)*amp+Math.sin(wx*freq*2.3+seed*2)*amp*0.4); }
  g.lineTo(VW+24,VH); g.closePath(); g.fill();
}
function bgTree(g,x,base,h,trunk,leaf){
  g.fillStyle=trunk; g.fillRect(x-7,base-h*0.55,14,h*0.55);
  g.fillStyle=leaf; g.beginPath(); g.arc(x,base-h*0.72,h*0.28,0,6.283); g.arc(x-h*0.2,base-h*0.56,h*0.22,0,6.283); g.arc(x+h*0.2,base-h*0.56,h*0.22,0,6.283); g.fill();
}
function bg1(g,cx,cy){

  const sg=g.createRadialGradient(780,90,10,780,90,170); sg.addColorStop(0,'rgba(255,246,170,1)'); sg.addColorStop(.3,'rgba(255,240,150,.85)'); sg.addColorStop(1,'rgba(255,240,150,0)'); g.fillStyle=sg; g.fillRect(560,-100,400,380);
  hills(g,cx*0.1,cy*0.12,'#b4e39a',LV.G-cy*0.12-330,34,0.004,1);

function bg2(g,cx,cy){
  const gr=g.createLinearGradient(0,0,0,VH); gr.addColorStop(0,'#0b1a2c'); gr.addColorStop(1,'#1c1038'); g.fillStyle=gr; g.fillRect(0,0,VW,VH);
  const mg=g.createRadialGradient(170,90,6,170,90,130); mg.addColorStop(0,'rgba(232,239,255,.9)'); mg.addColorStop(.25,'rgba(200,215,255,.35)'); mg.addColorStop(1,'rgba(200,215,255,0)'); g.fillStyle=mg; g.fillRect(0,0,320,260);
  g.fillStyle='#e8efff'; g.beginPath(); g.arc(170,90,26,0,6.283); g.fill();
  for(let i=0;i<34;i++){ g.globalAlpha=0.35+0.4*Math.abs(Math.sin(T*0.02+i)); g.fillStyle='#fff'; g.fillRect(rnd(i)*VW,rnd(i+50)*260,2,2); }
  g.globalAlpha=1;

      g.beginPath(); g.moveTo(x,120+rnd(i)*120); g.quadraticCurveTo(x+60,60+rnd(i+3)*60,x+90,40+rnd(i+5)*80); g.moveTo(x,200+rnd(i+7)*100); g.quadraticCurveTo(x-50,150,x-100,130+rnd(i+9)*60); g.stroke();
    }
  }
  for(let k=0;k<3;k++){ g.fillStyle='rgba(140,120,220,.06)'; g.beginPath(); g.ellipse(((T*0.3+k*400)%1400)-200,VH-120-k*50-cy*0.05,380,40,0,0,6.283); g.fill(); }
}
function bg3(g,cx,cy){
  const gr=g.createLinearGradient(0,0,0,VH); gr.addColorStop(0,'#3b2a6b'); gr.addColorStop(.55,'#c9507a'); gr.addColorStop(1,'#ffb36b'); g.fillStyle=gr; g.fillRect(0,0,VW,VH);

  hills(g,cx*0.1,cy*0.3,'#4a2a63',LV.G-cy*0.3-210,50,0.004,2);

    g.fillRect(x+100,b-250,60,250); g.beginPath(); g.moveTo(x+92,b-250); g.lineTo(x+130,b-320); g.lineTo(x+168,b-250); g.fill();
    g.fillStyle='rgba(255,200,120,.8)'; g.fillRect(x+122,b-200,8,16); g.fillRect(x+60,b-80,8,14); g.fillRect(x+190,b-80,8,14);
  }
}
function drawBg(g,cx,cy){ if(LV.theme===1) bg1(g,cx,cy); else if(LV.theme===2) bg2(g,cx,cy); else bg3(g,cx,cy); }

function drawTower(g,cx,cy){
  const t=LV.tower, x=t.x-cx, y0=t.top-cy, w=t.w, h=t.bot-t.top;
  g.fillStyle='#3a2e47'; g.fillRect(x,y0,w,h);
  g.strokeStyle='rgba(0,0,0,.28)'; g.lineWidth=2;
  const r0=Math.max(0,Math.floor((cy-t.top)/40)), r1=Math.min(Math.ceil(h/40),Math.ceil((cy+VH-t.top)/40));
  for(let r=r0;r<=r1;r++){
    const yy=t.top+r*40-cy; g.beginPath(); g.moveTo(x,yy); g.lineTo(x+w,yy); g.stroke();
    for(let bx=(r%2)*40;bx<w;bx+=80){ g.beginPath(); g.moveTo(x+bx,yy); g.lineTo(x+bx,yy+40); g.stroke(); }
  }
  for(let wy=t.top+140;wy<t.bot-120;wy+=330){
    const yy=wy-cy; if(yy<-90||yy>VH+90) continue;
    const wx=x+w/2;
    g.fillStyle='#1b1230'; g.beginPath(); g.moveTo(wx-26,yy+60); g.lineTo(wx-26,yy+10); g.arc(wx,yy+10,26,Math.PI,0); g.lineTo(wx+26,yy+60); g.closePath(); g.fill();
    const sg=g.createLinearGradient(0,yy-14,0,yy+60); sg.addColorStop(0,'#ff9f6b'); sg.addColorStop(1,'#7a3b8f'); g.fillStyle=sg;
    g.beginPath(); g.moveTo(wx-20,yy+60); g.lineTo(wx-20,yy+10); g.arc(wx,yy+10,20,Math.PI,0); g.lineTo(wx+20,yy+60); g.closePath(); g.fill();
    for(const tx of [x+16,x+w-16]){
      const ty=yy+120; g.fillStyle='#5b3b24'; g.fillRect(tx-3,ty,6,22);
      const fg=g.createRadialGradient(tx,ty-6,1,tx,ty-6,30); fg.addColorStop(0,'rgba(255,200,90,.7)'); fg.addColorStop(1,'rgba(255,200,90,0)'); g.fillStyle=fg; g.fillRect(tx-30,ty-36,60,60);
      g.fillStyle='#ffb02e'; g.beginPath(); g.ellipse(tx,ty-6,5,9+Math.sin(T*0.4+tx)*2,0,0,6.283); g.fill();
    }
  }
  g.fillStyle='#8b2f3c'; g.beginPath(); g.moveTo(x-50,y0); g.lineTo(x+w+50,y0); g.lineTo(x+w/2,y0-150); g.closePath(); g.fill();
  g.fillStyle='#ffd23d'; g.fillRect(x+w/2-2,y0-185,4,40); g.fillStyle='#ff4d6d'; g.beginPath(); g.moveTo(x+w/2+2,y0-185); g.lineTo(x+w/2+30,y0-174); g.lineTo(x+w/2+2,y0-163); g.fill();
}

function drawSolid(g,r,cx,cy){
  const x=r.x-cx+(r.ox||0), y=r.y-cy+(r.oy||0);
  if(x>VW+10||x+r.w<-10||y>VH+10||y+r.h<-10) return;
  const th=LV.theme;
  if(r.sk==='ground'){
    const w0=Math.max(x,-20), w1=Math.min(x+r.w,VW+20);
    g.fillStyle=['','#6b4a2b','#241a33','#5a4f66'][th]; g.fillRect(w0,y,w1-w0,r.h);
    g.fillStyle=['','#5fcf5c','#35553f','#8b7e96'][th]; g.fillRect(w0,y,w1-w0,12);
    g.fillStyle=['','#8be37a','#4b7a55','#a99cb6'][th]; g.fillRect(w0,y,w1-w0,4);
    for(let wx=Math.floor((w0+cx)/22)*22;wx<w1+cx;wx+=22){
      const sx=wx-cx, q=rnd(Math.floor(wx/22)+th*7);
      if(th===1){ g.fillStyle='#4aa84a'; g.beginPath(); g.moveTo(sx,y); g.lineTo(sx+3,y-6-q*8); g.lineTo(sx+8,y); g.fill();
        if(q>0.86){ g.fillStyle=q>0.93?'#ff7ab8':'#ffe066'; g.beginPath(); g.arc(sx+4,y-9,3,0,6.283); g.fill(); } }
      else if(th===2){ if(q>0.9){ g.fillStyle='#5be0d0'; g.beginPath(); g.arc(sx+4,y-3,2.6,0,6.283); g.fill(); } }
      else { g.strokeStyle='rgba(0,0,0,.22)'; g.lineWidth=2; g.beginPath(); g.moveTo(sx,y+12); g.lineTo(sx,y+44); g.stroke(); }
    }
    if(th===3){ g.strokeStyle='rgba(0,0,0,.22)'; g.lineWidth=2; g.beginPath(); g.moveTo(w0,y+44); g.lineTo(w1,y+44); g.stroke(); }
  } else if(r.sk==='branch'){
    if(th===1){ g.fillStyle='#9b6a3a'; rr(g,x,y,r.w,r.h,7); g.fill(); g.fillStyle='#7d5229'; g.fillRect(x+4,y+r.h-5,r.w-8,4);
      g.fillStyle='#5fcf5c'; rr(g,x-2,y-4,r.w+4,9,4); g.fill();
      for(let i=0;i<r.w/36;i++){ g.fillStyle=(i+((r.x/10)|0))%3?'#ffe066':'#ff7ab8'; g.beginPath(); g.arc(x+12+i*36,y-6,2.6,0,6.283); g.fill(); } }
    else { g.fillStyle='#33264a'; rr(g,x,y,r.w,r.h,7); g.fill(); g.fillStyle='#3f6b4a'; rr(g,x-2,y-3,r.w+4,8,4); g.fill();
      g.fillStyle='#5be0d0'; g.beginPath(); g.arc(x+r.w*0.3,y-4,2.4,0,6.283); g.fill(); }
  } else if(r.sk==='landing'){
    g.fillStyle='#8b7e96'; rr(g,x,y,r.w,r.h,5); g.fill(); g.fillStyle='#a99cb6'; g.fillRect(x+3,y,r.w-6,4); g.fillStyle='#5a4f66'; g.fillRect(x,y+r.h-5,r.w,5);
  } else if(r.sk==='step'){
    g.fillStyle='#b07a45'; rr(g,x,y,r.w,r.h,3); g.fill(); g.strokeStyle='rgba(60,30,10,.45)'; g.lineWidth=1.5;
    for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(x+i*r.w/4,y); g.lineTo(x+i*r.w/4,y+r.h); g.stroke(); }
    g.fillStyle='#e0b27a'; g.fillRect(x+2,y+1,r.w-4,3);
    if(r.st===1){ g.strokeStyle='#4a2a10'; g.beginPath(); g.moveTo(x+r.w*0.3,y); g.lineTo(x+r.w*0.4,y+r.h); g.moveTo(x+r.w*0.7,y); g.lineTo(x+r.w*0.6,y+r.h); g.stroke(); }
  } else {
    g.fillStyle='#5b4b66'; g.fillRect(x,y,r.w,r.h); g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=2;
    const a0=Math.max(0,Math.floor((cy-r.y)/40)), a1=Math.ceil(Math.min(r.h,cy+VH-r.y)/40);
    for(let k=a0;k<=a1;k++){ const yy=y+k*40; g.beginPath(); g.moveTo(x,yy); g.lineTo(x+r.w,yy); g.stroke(); g.beginPath(); g.moveTo(x+(k%2?10:25),yy); g.lineTo(x+(k%2?10:25),yy+40); g.stroke(); }
  }
}

function drawThorns(g,r,cx,cy){
  const x=r.x-cx, y=r.y-cy;
  if(x>VW+30||x+r.w<-30||y>VH+30||y+r.h<-30) return;

    g.fillRect(x,y,r.w,r.h);
    for(let yy=0;yy<r.h;yy+=22){ g.fillStyle='#4a2a5a';
      g.beginPath(); g.moveTo(x,y+yy); g.lineTo(x-13,y+yy+11); g.lineTo(x,y+yy+22); g.fill();
      g.beginPath(); g.moveTo(x+r.w,y+yy); g.lineTo(x+r.w+13,y+yy+11); g.lineTo(x+r.w,y+yy+22); g.fill();
      g.fillStyle='#ff4d6d'; g.fillRect(x-13,y+yy+10,2,2); g.fillRect(x+r.w+11,y+yy+10,2,2); }
    for(let xx=0;xx<r.w;xx+=14){ g.fillStyle='#4a2a5a'; g.beginPath(); g.moveTo(x+xx,y); g.lineTo(x+xx+7,y-18); g.lineTo(x+xx+14,y); g.fill(); g.fillStyle='#ff4d6d'; g.fillRect(x+xx+6,y-18,2,2); }

    g.fillRect(x,y+r.h-7,r.w,7);
    for(let xx=0;xx<r.w;xx+=14){ const hh=r.h*(0.75+0.25*rnd(Math.floor((r.x+xx)/14)));
      g.fillStyle='#4a2a5a'; g.beginPath(); g.moveTo(x+xx,y+r.h); g.lineTo(x+xx+7,y+r.h-hh); g.lineTo(x+xx+14,y+r.h); g.fill();
      g.fillStyle='#ff4d6d'; g.beginPath(); g.arc(x+xx+7,y+r.h-hh+2,1.8,0,6.283); g.fill(); }
  }
}

function ventState(v){ const c=(T+v.ph)%240; return c<130?0:(c<175?1:(c<235?2:0)); }
function drawVent(g,v,cx,cy){
  const x=v.x-cx, gy=LV.G-cy; if(x<-60||x>VW+60) return;
  const s=ventState(v);
  if(LV.theme===2){
    const hh=s===2?v.h:(s===1?28+Math.sin(T*0.5)*4:12);
    g.fillStyle='#2b1536'; g.fillRect(x-24,gy-6,48,8);
    for(let i=-2;i<=2;i++){ const bx=x+i*9, ht=hh*(1-Math.abs(i)*0.12);
      g.fillStyle='#4a2a5a'; g.beginPath(); g.moveTo(bx-6,gy); g.lineTo(bx+(i%2?2:-2),gy-ht); g.lineTo(bx+6,gy); g.fill();
      if(s>0){ g.fillStyle='#ff4d6d'; g.beginPath(); g.arc(bx+(i%2?2:-2),gy-ht+2,2,0,6.283); g.fill(); } }
  } else {
    g.fillStyle='#2a2230'; g.fillRect(x-26,gy-4,52,8); g.fillStyle=s===0?'#55392f':'#ff6a2e'; for(let i=-2;i<=2;i++) g.fillRect(x+i*9-2,gy-3,4,5);
    if(s===1){ for(let i=0;i<5;i++){ g.fillStyle='#ffb02e'; g.beginPath(); g.arc(x+(rnd(i+T*0.2|0)-0.5)*40,gy-8-((T*2+i*13)%46),2.2,0,6.283); g.fill(); } }
    if(s===2) drawFlameColumn(g,x,gy-v.h,gy,46,T);
  }
}
function ventRect(v){ return {x:v.x-(LV.theme===2?20:22),y:LV.G-v.h,w:LV.theme===2?40:44,h:v.h}; }

function drawVine(g,v,cx,cy){
  const x=v.x-cx, y1=v.y1-cy, y2=v.y2-cy;
  if(x<-30||x>VW+30||y2<-10||y1>VH+10) return;
  const a=Math.max(y1,-10), b=Math.min(y2,VH+10);
  g.strokeStyle=LV.theme===2?'#2f8a55':'#3fa35a'; g.lineWidth=5; g.lineCap='round'; g.beginPath();
  for(let yy=a;yy<=b;yy+=10){ const sx=x+Math.sin(T*0.03+(yy+cy)*0.02)*3; if(yy===a) g.moveTo(sx,yy); else g.lineTo(sx,yy); }
  g.stroke();
  for(let wy=Math.ceil(v.y1/36)*36;wy<v.y2;wy+=36){
    const yy=wy-cy; if(yy<-10||yy>VH+10) continue;
    const side=((wy/36)|0)%2?1:-1, sx=x+Math.sin(T*0.03+wy*0.02)*3;
    g.fillStyle=LV.theme===2?'#3fb36b':'#58c46e'; g.beginPath(); g.ellipse(sx+side*8,yy,8,4,side*0.5,0,6.283); g.fill();
  }
}

function drawLava(g,r,cx,cy){
  const x=r.x-cx, y=r.y-cy; if(x>VW||x+r.w<0||y>VH) return;
  const gr=g.createLinearGradient(0,y,0,y+r.h); gr.addColorStop(0,'#ffb02e'); gr.addColorStop(.4,'#ff6a2e'); gr.addColorStop(1,'#a8200f');
  g.fillStyle=gr; g.fillRect(x,y,r.w,r.h);
  g.fillStyle='#ffe27a'; for(let i=0;i<r.w/30;i++){ g.beginPath(); g.arc(x+15+i*30,y+3+Math.sin(T*0.1+i)*2,5,0,Math.PI); g.fill(); }
}

function drawBarrier(g,b,cx,cy){
  const x=b.x-cx, y=b.y-cy; if(x>VW+80||x+b.w<-80||y>VH+80||y+b.h<-80) return;
  const a=1-b.op; if(a<=0) return;
  g.save(); g.globalAlpha=a;
  if(b.kind==='wall') drawThorns(g,b,cx,cy);
  else if(b.kind==='door'){
    g.fillStyle='#6b4a2b'; rr(g,x,y,b.w,b.h,8); g.fill();
    g.strokeStyle='rgba(30,15,5,.5)'; g.lineWidth=2; for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(x+i*b.w/4,y); g.lineTo(x+i*b.w/4,y+b.h); g.stroke(); }
    g.fillStyle='#3a3340'; g.fillRect(x,y+b.h*0.2,b.w,8); g.fillRect(x,y+b.h*0.7,b.w,8);
    g.fillStyle='#ffd23d'; g.beginPath(); g.arc(x+b.w-12,y+b.h/2,5,0,6.283); g.fill();
  } else {
    const col=LV.theme===1?'#9b6a3a':'#5a6b8a';
    g.fillStyle=col; g.fillRect(x,y,12,b.h); g.fillRect(x+b.w-12,y,12,b.h);
    g.strokeStyle=col; g.lineWidth=12; g.beginPath(); g.arc(x+b.w/2,y+8,b.w/2-6,Math.PI,0); g.stroke();
    const mg=g.createLinearGradient(x,y,x+b.w,y); mg.addColorStop(0,'rgba(120,255,200,.12)'); mg.addColorStop(.5,'rgba(255,255,255,.4)'); mg.addColorStop(1,'rgba(120,255,200,.12)');
    g.fillStyle=mg; g.fillRect(x+12,y+8,b.w-24,b.h-8);
    for(let i=0;i<6;i++){ star(g,x+14+rnd(i+b.x)*(b.w-28),y+16+((T*0.6+i*40)%(b.h-30)),3,'#fff'); }
    if(LV.theme===1){ const fl=['#ff7ab8','#ffe066','#ffffff','#ff9a2e']; for(let i=0;i<12;i++){ const a2=Math.PI+i*Math.PI/11; g.fillStyle=fl[i%4]; g.beginPath(); g.arc(x+b.w/2+Math.cos(a2)*(b.w/2-6),y+8+Math.sin(a2)*(b.w/2-6),5,0,6.283); g.fill(); } }
  }

}

function drawPortal(g,r,cx,cy){
  const x=r.x+r.w/2-cx, y=r.y+r.h/2-cy; if(x<-120||x>VW+120) return;

/* ===== I tre scenari =====

const LEVELS={};
function newLevel(n,W,H,G,name){

          start:{x:90,y:G-46},portal:null,need:0,dragon:null,fb:[],calm:0,tower:null,towerX:1e9};
}
function addGround(L,x0,x1){ L.solids.push({x:x0,y:L.G,w:x1-x0,h:L.H-L.G+300,sk:'ground'}); }
function addBranch(L,x,y,w,sk){ const r={x,y,w,h:14,sk:sk||'branch',ow:true}; L.solids.push(r); return r; }
function addFruit(L,x,y,hidden){ L.fruits.push({x,y,k:L.fruits.length%5,got:false,hidden:!!hidden}); }

/* ---------- Scenario 1: il bosco luminoso ---------- */
LEVELS[1]=function(){
  const L=newLevel(1,7700,900,800,'Il Bosco Luminoso'); L.need=10;
  addGround(L,0,L.W);
  for(let i=0;i<8;i++){
    const cx=620+i*820, nb=i<3?3:(i<6?4:5);
    for(let j=0;j<nb;j++) addBranch(L,cx+(j%2)*130,L.G-100*(j+1),170+((i+j)%3)*20);
    addFruit(L,cx+((nb-1)%2)*130+85,L.G-100*nb-34,false);
  }
  for(let i=0;i<4;i++){ const bx=950+i*820; addBranch(L,bx,L.G-190,140); addFruit(L,bx+70,L.G-226,false); }
  const used=[];
  for(let i=0;i<6;i++){ const x=1240+i*820; used.push(x); L.bushes.push({x,fruit:L.fruits.length,sh:0}); addFruit(L,x,L.G-30,true); }
  for(let x=280;x<6800;x+=150+((rnd(x)*120)|0)){
    if(used.some(u=>Math.abs(u-x)<110)) continue;
    L.bushes.push({x,fruit:-1,sh:0});
  }
  L.owls.push({x:6880,y:L.G,solved:false,cool:0,
    q:'Ho molte foglie ma non sono un albero. Ti racconto storie senza parlare. Che cosa sono?',
    opts:['Un libro','Un cespuglio','Un fungo'],ans:0,

  L.barriers.push({kind:'arch',x:7150,y:L.G-200,w:150,h:200,op:0,open:false,own:0,needFruit:true});
  L.portal={x:7450,y:L.G-150,w:70,h:150};

};

/* ---------- Scenario 2: il bosco oscuro ---------- */
LEVELS[2]=function(){
  const L=newLevel(2,9000,900,800,'Il Bosco Oscuro'); const G=L.G;
  let gs=0, cx=760;
  const seq=['thorns','gap','thorns','wallvine','floating','thorns','gap','wallvine','floating','thorns','gap','wallvine','floating','thorns'];
  for(const t of seq){
    if(t==='thorns'){
      const w=100+((rnd(cx)*60)|0); L.hazards.push({x:cx,y:G-46,w,h:46,t:'th'});
      addFruit(L,cx+w/2,G-120,false); cx+=w+400;
    } else if(t==='gap'){
      const gw=150+((rnd(cx)*40)|0); addGround(L,gs,cx);
      L.hazards.push({x:cx,y:G+60,w:gw,h:90,t:'th'}); gs=cx+gw; cx=gs+380;
    } else if(t==='wallvine'){
      const vx=cx+40, wx=cx+170;
      L.hazards.push({x:wx,y:G-300,w:46,h:300,t:'wall'});
      L.vines.push({x:vx,y1:G-340,y2:G});
      addBranch(L,vx-30,G-340,wx+46+100-(vx-30));
      addFruit(L,wx+22,G-380,false); cx=wx+46+100+360;
    } else {
      const gw=330; addGround(L,gs,cx);
      L.hazards.push({x:cx,y:G+60,w:gw,h:90,t:'th'});
      addBranch(L,cx+20,G-70,90); addBranch(L,cx+130,G-110,90); addBranch(L,cx+240,G-70,90);
      addFruit(L,cx+175,G-150,false); gs=cx+gw; cx=gs+380;
    }
  }
  L.owls.push({x:cx+80,y:G,solved:false,cool:0,
    q:'Nella grotta ci sono 9 lucciole. Ne volano via 4 e ne arrivano 2. Quante lucciole ci sono adesso?',
    opts:['5','7','6'],ans:1,ok:'Giusto! Il muro di rovi si ritira.'});
  L.barriers.push({kind:'wall',x:cx+520,y:G-340,w:50,h:340,op:0,open:false,own:0});
  L.W=cx+1300; addGround(L,gs,L.W);
  L.portal={x:L.W-240,y:G-150,w:70,h:150};
  return L;
};

/* ---------- Scenario 3: il castello del drago ---------- */
LEVELS[3]=function(){
  const L=newLevel(3,5400,2000,1900,'Il Castello del Drago'); const G=L.G;
  addGround(L,0,800); addGround(L,980,1700); addGround(L,1900,2600); addGround(L,2820,5400);
  for(const g of [[800,180],[1700,200],[2600,220]]) L.hazards.push({x:g[0],y:G+40,w:g[1],h:80,t:'lava'});
  [[520,0],[1250,80],[2200,160],[3050,40]].forEach(v=>L.vents.push({x:v[0],h:150,ph:v[1]}));
  [[1150,G-40],[2300,G-40],[3300,G-40]].forEach(f=>addFruit(L,f[0],f[1]-60,false));
  L.owls.push({x:3300,y:G,solved:false,cool:0,
    q:'Il drago ha 3 amici e ognuno ha 2 ali. Quante ali ci sono in tutto?',
    opts:['5','8','6'],ans:2,ok:'Esatto! Il portone del castello si apre.'});
  L.barriers.push({kind:'door',x:3640,y:G-220,w:56,h:220,op:0,open:false,own:0});
  const TX=4500, TOP=300;
  L.tower={x:TX,top:TOP,bot:G,w:260}; L.towerX=TX-380;
  L.solids.push({x:TX,y:TOP,w:260,h:G-TOP,sk:'tower'});
  L.solids.push({x:TX+250,y:TOP-60,w:24,h:60,sk:'wall'});
  for(let i=0;i<15;i++){
    const y=G-100*(i+1);
    if(i===14){ addBranch(L,TX-120,y,120,'landing'); continue; }
    if(i%4===3){ const r=addBranch(L,4090+(i%2)*40,y,170,'landing'); if(i===7) L.owlStep=r; }
    else { const r=addBranch(L,4050+(i%2)*230,y,120,'step'); r.crumble=true; r.t=0; r.fall=false; r.ox=0; r.oy=0; r.vy=0; r.ft=0; r.st=i%3===1?1:0; }
  }
  addFruit(L,4180,G-4*100-40,false); addFruit(L,4180,G-12*100-40,false);
  const os=L.owlStep;
  L.owls.push({x:os.x+os.w-40,y:os.y,solved:false,cool:0,
    q:'Che cosa va su e giù ma resta sempre ferma?',
    opts:['La nuvola','La scala','La fata'],ans:1,ok:'Bravissima! Il drago si è addormentato.'});
  L.barriers.push({kind:'none',x:0,y:0,w:0,h:0,op:1,open:false,own:1,calm:true});
  L.altar={x:TX+130,y:TOP};
  L.portal={x:TX+90,y:TOP-120,w:80,h:120,altar:true};
  L.dragon={x:700,y:G-430,ph:'move',t:0,rn:.5,col:null,face:1};
  return L;
};

/* ----- collisioni ----- */
function blockers(){
  const a=[]; for(const r of LV.solids) if(!r.fall) a.push(r);
  for(const b of LV.barriers) if(!b.open&&b.w>0) a.push(b);
  return a;
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
let landed=null;
function moveX(dx,blk){
  P.x+=dx;
  for(const r of blk){ if(r.ow) continue; if(ov(P,r)){ if(dx>0) P.x=r.x-P.w; else if(dx<0) P.x=r.x+r.w; P.vx=0; } }
  P.x=clamp(P.x,0,LV.W-P.w);
}
function moveY(dy,blk){
  const pb=P.y+P.h; P.y+=dy; P.on=false; landed=null;
  for(const r of blk){
    if(!ov(P,r)) continue;
    if(r.ow){ if(dy>=0&&pb<=r.y+1&&P.drop<=0){ P.y=r.y-P.h; P.vy=0; P.on=true; landed=r; } }
    else if(dy>0||(dy===0&&pb<=r.y+1)){ P.y=r.y-P.h; P.vy=0; P.on=true; landed=r; }
    else if(dy<0){ P.y=r.y+r.h; P.vy=0; }
  }
}
function vineAt(){
  for(const v of LV.vines) if(Math.abs(P.x+P.w/2-v.x)<14&&P.y+P.h>v.y1+4&&P.y+14<v.y2) return v;
  return null;
}

const OPT_R=i=>({x:120,y:218+i*62,w:720,h:52});
function updRiddle(){
  riddle.t++;
  if(riddle.good){ if(riddle.t>riddle.tEnd) closeRiddle(true); return; }
  let pick=-1;
  if(pressed.a1) pick=0; if(pressed.a2) pick=1; if(pressed.a3) pick=2;
  if(lastTap){
    for(let i=0;i<3;i++){ const r=OPT_R(i); if(lastTap.x>=r.x&&lastTap.x<=r.x+r.w&&lastTap.y>=r.y&&lastTap.y<=r.y+r.h) pick=i; }
    if(lastTap.x>740&&lastTap.y>420&&lastTap.y<=500&&lastTap.x<=880) { closeRiddle(false); return; }
  }
  if(pick>=0&&!riddle.bad.includes(pick)){
    if(pick===riddle.o.ans){ riddle.good=true; riddle.tEnd=riddle.t+90; riddle.msg=riddle.o.ok; SFX.check(); emit(P.x+11,P.y,30,'#ffe066',4,40); }
    else { riddle.bad.push(pick); riddle.msg='Quasi! Prova con un\'altra risposta.'; SFX.hurt(); }
  }
}
function drawRiddle(g){
  const o=riddle.o;
  g.fillStyle='rgba(15,8,35,.72)'; g.fillRect(0,0,VW,VH);
  g.fillStyle='#fff6e0'; rr(g,90,40,780,460,26); g.fill(); g.strokeStyle='#ffc83d'; g.lineWidth=5; rr(g,90,40,780,460,26); g.stroke();
  drawOwl(g,170,150,1.5,T,false);
  g.fillStyle='#3b1d63'; g.font='800 26px '+FONT; g.textAlign='left'; g.textBaseline='middle';
  const words=o.q.split(' '); let line='', yy=88;
  for(const w of words){ const t2=line?line+' '+w:w; if(g.measureText(t2).width>560&&line){ g.fillText(line,250,yy); line=w; yy+=32; } else line=t2; }
  g.fillText(line,250,yy);
  for(let i=0;i<3;i++){
    const r=OPT_R(i), bad=riddle.bad.includes(i), good=riddle.good&&i===o.ans;
    g.fillStyle=good?'#6fd16f':(bad?'#cfc6d8':'#ffd9ee'); rr(g,r.x,r.y,r.w,r.h,16); g.fill();
    g.strokeStyle=good?'#2f8f2f':'#ff7ab8'; g.lineWidth=3; rr(g,r.x,r.y,r.w,r.h,16); g.stroke();
    g.fillStyle=bad?'#8a7f96':'#3b1d63'; g.font='800 28px '+FONT; g.textAlign='left'; g.fillText((i+1)+'   '+o.opts[i],r.x+24,r.y+r.h/2+2);
  }
  g.textAlign='center'; g.fillStyle=riddle.good?'#2f8f2f':'#b0306a'; g.font='800 26px '+FONT; g.fillText(riddle.msg,420,444);
  g.fillStyle='#e8d9f2'; rr(g,740,430,140,48,14); g.fill(); g.fillStyle='#3b1d63'; g.font='800 22px '+FONT; g.fillText('Esci',810,455);
  g.font='700 15px '+FONT; g.fillStyle='#7a5a96'; g.fillText('Tocca la risposta o premi 1, 2, 3',330,482);
}

/* ----- drago ----- */
function updDragon(){
  const D=LV.dragon; if(!D) return;
  D.t++;
  const inTower=P.x>LV.towerX;
  if(!inTower){
    D.face=1; D.y+=((LV.G-440)-D.y)*0.05;
    if(D.ph==='move'){ const tg=P.x+P.face*150+(D.rn-0.5)*140; D.x+=clamp(tg-D.x,-3.2,3.2); if(D.t>150){ D.ph='aim'; D.t=0; } }
    else if(D.ph==='aim'){ if(D.t>80){ D.ph='breath'; D.t=0; SFX.fire(); } }
    else if(D.ph==='breath'){ D.col={x:D.x-26,y:D.y+10,w:52,h:LV.G-D.y-10}; if(D.t%3===0) emit(D.x+(Math.random()-.5)*40,LV.G-Math.random()*60,2,'#ffb02e',2,24,-0.05); if(D.t>42){ D.ph='rest'; D.t=0; D.col=null; } }
    else if(D.t>90){ D.ph='move'; D.t=0; D.rn=Math.random(); }
  } else {
    D.col=null; D.face=-1;
    if(D.ph==='breath'||D.ph==='move'||D.ph==='aim'||D.ph==='rest'){}
    D.x+=((LV.towerX-340)-D.x)*0.04;
    const top=P.y<LV.tower.top+200;
    if(D.ph!=='aim') D.y+=(clamp(P.y+10,LV.tower.top+60,LV.G-160)-D.y)*0.03;
    if(LV.calm>0||top){ D.ph='rest'; D.t=0; return; }
    if(D.ph==='rest'||D.ph==='breath'){ if(D.t>110){ D.ph='aim'; D.t=0; } }
    else if(D.ph==='move'){ D.ph='aim'; D.t=0; }
    else if(D.ph==='aim'&&D.t>75){ LV.fb.push({x:D.x+84,y:D.y-2,vx:4.4}); SFX.fire(); D.ph='rest'; D.t=0; }
  }
  for(const f of LV.fb){ f.x+=f.vx; if(Math.random()<.5) emit(f.x-8,f.y,1,'#ffb02e',1,18,0); }
  LV.fb=LV.fb.filter(f=>f.x<LV.tower.x+10);
}

/* ----- aggiornamento ----- */
function updatePlay(){
  const blk=blockers();
  if(LV.calm>0) LV.calm--;
  // gufi
  for(const o of LV.owls){
    if(o.cool>0) o.cool--;
    const d=Math.hypot(P.x+11-o.x,P.y+23-(o.y-20));
    if(!o.solved&&o.cool<=0&&d<85){ openRiddle(o); return; }
  }
  // barriere
  for(const b of LV.barriers){
    if(b.open){ b.op=Math.min(1,b.op+0.02); continue; }
    if(b.calm||b.w===0) continue;
    const o=LV.owls[b.own];
    const full=!b.needFruit||basket>=LV.need;
    if(o.solved&&full){ b.open=true; SFX.check(); emit(b.x+b.w/2,b.y+b.h/2,40,'#fff6c0',5,50,0.02); continue; }
    if(bannerCool<=0&&Math.abs(P.x+P.w/2-(b.x+b.w/2))<130){
      say(o.solved?'Il cesto non e\' ancora pieno: servono '+LV.need+' frutti!':'Il gufo conosce il segreto per aprire il passaggio!','good',220);
      bannerCool=400;
    }
  }
  if(bannerCool>0) bannerCool--;
  // gradini che crollano
  for(const r of LV.solids){
    if(!r.crumble) continue;
    if(r.fall){ r.vy+=0.6; r.oy+=r.vy; r.ft++; if(r.ft>260){ r.fall=false; r.oy=0; r.ox=0; r.t=0; r.vy=0; } }
    else { if(r!==landed) r.t=Math.max(0,r.t-0.6); r.ox=r.t>40?(Math.random()-.5)*3:0; }
  }
  // movimento
  const L=keys.left, R=keys.right;
  const ax=(R?1:0)-(L?1:0);
  if(P.noClimb>0) P.noClimb--;
  if(P.drop>0) P.drop--;
  if(P.climb){
    const v=P.climb; P.vx=0; P.vy=0; P.x=v.x-P.w/2;
    if(keys.up) P.y-=2.6; if(keys.down) P.y+=2.8;
    P.pose='climb'; if(P.y+P.h<=v.y1+2){ P.climb=null; P.vy=-6.5; P.noClimb=20; P.jumps=1; }
    else if(P.y+P.h>=v.y2){ P.climb=null; P.noClimb=10; }
    else if(pressed.jump){ P.climb=null; P.vy=-8.5; P.vx=ax*3; P.jumps=1; P.noClimb=18; SFX.jump(); }
    if(Math.random()<.2) SFX.vine();
  } else {
    if(P.noClimb<=0&&(keys.up||keys.down)){ const v=vineAt(); if(v){ P.climb=v; P.x=v.x-P.w/2; P.vx=0; P.vy=0; } }
    const acc=P.on?0.55:0.35, tgt=ax*SPEED;
    if(ax!==0){ P.vx+=clamp(tgt-P.vx,-acc,acc); P.face=ax; } else P.vx*=P.on?0.8:0.95;
    if(Math.abs(P.vx)<0.05) P.vx=0;
    if(P.on) P.coy=7; else if(P.coy>0) P.coy--;
    if(pressed.jump){
      if(keys.down&&landed&&landed.ow){ P.drop=14; P.y+=2; }
      else if(P.coy>0){ P.vy=-JUMP; P.jumps=1; P.coy=0; P.on=false; SFX.jump(); emit(P.x+11,P.y+P.h,6,'#ffe9f6',1.5,20); }
      else if(P.jumps<2){ P.vy=-9.5; P.jumps=2; SFX.flap(); emit(P.x+11,P.y+P.h-4,12,'#ffd0f0',2,28); }
    }
    let g=GRAV; if(!keys.jump&&P.vy<-3) g=1.1;
    P.vy=Math.min(P.vy+g,12);
    if(keys.jump&&P.vy>1.5&&P.jumps>=1&&!P.on){ P.vy=1.5; if(Math.random()<.5) emit(P.x+11,P.y+10,1,'#ffd0f0',.6,24,0.01); }
    moveX(P.vx,blk); moveY(P.vy,blk);
    if(P.on){ P.jumps=0; if(landed&&landed.crumble){ landed.t++; if(landed.t===45) SFX.crumble(); if(landed.t>=(landed.st?60:90)){ landed.fall=true; landed.ft=0; landed.vy=0; emit(landed.x+landed.w/2,landed.y,14,'#c89a62',2,30); } } }
    P.pose=P.on?(Math.abs(P.vx)>0.5?'run':'idle'):(keys.jump&&P.vy>1?'glide':'jump');
  }
  if(P.inv>0) P.inv--;
  if(!P.climb&&P.on&&landed&&!landed.crumble&&!nearHazard(P.x)) LV.safe={x:P.x,y:P.y};
  // frutti
  const pc={x:P.x-4,y:P.y,w:P.w+8,h:P.h};
  for(const f of LV.fruits){
    if(f.got) continue;
    if(f.hidden){
      const b=LV.bushes.find(q=>LV.fruits[q.fruit]===f);
      if(b&&ov(pc,{x:b.x-30,y:LV.G-50,w:64,h:50})){ f.got=true; b.sh=40; basket++; SFX.fruit(); emit(b.x,LV.G-40,18,'#ffe066',3,36,0.04); say('Trovato un frutto! ('+basket+')','good',90); }
    } else if(Math.hypot(P.x+11-f.x,P.y+24-f.y)<28){
      f.got=true; basket++; SFX.fruit(); emit(f.x,f.y,16,'#ffe066',3,34,0.02);
    }
  }
  for(const b of LV.bushes){ if(b.sh>0) b.sh--; else if(ov(pc,{x:b.x-28,y:LV.G-40,w:56,h:40})&&Math.abs(P.vx)>1) b.sh=18; }
  // pericoli
  updDragon();
  const hb={x:P.x+4,y:P.y+8,w:P.w-8,h:P.h-10};
  let dead=false;
  for(const h of LV.hazards){ if(ov(hb,{x:h.x+4,y:h.y+4,w:h.w-8,h:h.h-6})) dead=true; }
  for(const v of LV.vents) if(ventState(v)===2&&ov(hb,ventRect(v))) dead=true;
  const D=LV.dragon; if(D&&D.col&&ov(hb,D.col)) dead=true;
  for(const f of LV.fb) if(ov(hb,{x:f.x-12,y:f.y-12,w:24,h:24})) dead=true;
  if(P.y>LV.H+100) dead=true;
  if(dead&&LV.n>1&&!(P.inv>0)){ die(); return; }
  // arrivo
  const pt=LV.portal;
  if(pt&&ov(P,pt)){ if(pt.altar) startWin(); else finishLevel(); }
}

function updateCam(){
  const L=300, R=VW-400, Tp=190, Bt=VH-200;
  let tx=cam.x, ty=cam.y;
  const sx=P.x-cam.x, sy=P.y-cam.y;
  if(sx<L) tx=P.x-L; else if(sx>R) tx=P.x-R;
  if(sy<Tp) ty=P.y-Tp; else if(sy>Bt) ty=P.y-Bt;
  tx=clamp(tx,0,LV.W-VW); ty=clamp(ty,0,LV.H-VH);
  cam.x+=(tx-cam.x)*0.14; cam.y+=(ty-cam.y)*0.14;
}

/* ----- disegno del mondo ----- */
function drawWorld(g){
  const cx=Math.round(cam.x), cy=Math.round(cam.y);
  drawBg(g,cx,cy);
  if(LV.tower) drawTower(g,cx,cy);
  for(const r of LV.solids) drawSolid(g,r,cx,cy);
  if(LV.altar) drawAltar(g,LV.altar.x,LV.altar.y,cx,cy,mode==='win');
  for(const v of LV.vines) drawVine(g,v,cx,cy);
  for(const h of LV.hazards){ if(h.t==='lava') drawLava(g,h,cx,cy); else drawThorns(g,h,cx,cy); }
  for(const v of LV.vents) drawVent(g,v,cx,cy);
  for(const b of LV.barriers) if(b.w>0) drawBarrier(g,b,cx,cy);
  if(LV.portal&&!LV.portal.altar) drawPortal(g,LV.portal,cx,cy);
  for(const f of LV.fruits){ if(f.got||f.hidden) continue; const x=f.x-cx, y=f.y-cy; if(x>-30&&x<VW+30&&y>-30&&y<VH+30) drawFruit(g,x,y,f.k,T); }
  for(const b of LV.bushes){
    const x=b.x-cx; if(x<-70||x>VW+70) continue;
    drawBush(g,x,LV.G-cy,b.sh,LV.theme===2);
    if(b.fruit>=0&&!LV.fruits[b.fruit].got&&Math.hypot(P.x-b.x,P.y-LV.G)<230&&T%50<25) star(g,x+((T*0.1)%24)-12,LV.G-cy-30-((T*0.3)%16),3.5,'#fff6a0');
  }
  for(const o of LV.owls){ const x=o.x-cx; if(x>-80&&x<VW+80) drawOwl(g,x,o.y-cy,1.1,T,o.solved); }
  const D=LV.dragon;
  if(D){
    g.save(); g.translate(D.x-cx+(D.face>0?68:-76),D.y-cy); g.scale(D.face,1);
    if(D.face<0&&LV.calm>0) g.globalAlpha=0.9;
    drawDragon(g,0,0,0.9,T,D.ph==='aim'||D.ph==='breath'); g.restore();
    if(D.face>0){
      if(D.ph==='aim'){ const a=0.3+0.25*Math.sin(T*0.5); g.fillStyle='rgba(255,60,40,'+a+')'; g.fillRect(D.x-26-cx,D.y+30-cy,52,LV.G-D.y-30);
        txt(g,'!',D.x-cx,LV.G-cy-60,34,'#ff4040'); }
      if(D.col) drawFlameColumn(g,D.x-cx,D.y+14-cy,LV.G-cy,56,T);
    } else {
      if(D.ph==='aim'){ g.fillStyle='rgba(255,60,40,'+(0.25+0.2*Math.sin(T*0.5))+')'; g.fillRect(D.x+90-cx,D.y-6-cy,LV.tower.x-D.x-90,8); txt(g,'!',D.x+110-cx,D.y-30-cy,34,'#ff4040'); }
      if(LV.calm>0) txt(g,'Zzz',D.x-cx,D.y-70-cy,26,'#cfe6ff');
    }
  }
  for(const f of LV.fb){ const x=f.x-cx, y=f.y-cy; const gl=g.createRadialGradient(x,y,2,x,y,24); gl.addColorStop(0,'#fff6a0'); gl.addColorStop(.4,'#ff9a2e'); gl.addColorStop(1,'rgba(255,60,20,0)'); g.fillStyle=gl; g.fillRect(x-26,y-26,52,52); }
  if(mode!=='dead'||deadT<10){
    const px=P.x+P.w/2-cx, py=P.y+P.h-cy;
    if(basket>0&&mode!=='win'){ drawBasket(g,px-P.face*20,py-14,0.7); }
    if(P.inv>0&&T%8<4) g.globalAlpha=.45;
    drawFairy(g,px,py,1.05,P.face,T,PAL_GOOD,P.pose); g.globalAlpha=1;
  }
  if(LV.theme===2){
    const px=P.x+P.w/2-cx, py=P.y+20-cy;
    const gl=g.createRadialGradient(px,py,50,px,py,430); gl.addColorStop(0,'rgba(5,5,25,0)'); gl.addColorStop(.35,'rgba(5,5,25,.35)'); gl.addColorStop(1,'rgba(5,5,25,.88)');
    g.fillStyle=gl; g.fillRect(0,0,VW,VH);
    const w=g.createRadialGradient(px+P.face*14,py-6,2,px+P.face*14,py-6,90); w.addColorStop(0,'rgba(255,200,240,.35)'); w.addColorStop(1,'rgba(255,200,240,0)'); g.fillStyle=w; g.fillRect(px-100,py-100,220,200);
  }
  drawParts(g,cx,cy);
}

function drawBanner(g){
  const b=banners[0]; if(!b) return;
  const a=Math.min(1,b.t/20,(b.max-b.t)/12+0.01);
  g.save(); g.globalAlpha=clamp(a,0,1);
  g.fillStyle=b.who==='evil'?'rgba(50,10,70,.9)':'rgba(255,246,224,.95)';
  rr(g,150,64,660,76,20); g.fill(); g.strokeStyle=b.who==='evil'?'#33c957':'#ffc83d'; g.lineWidth=3; rr(g,150,64,660,76,20); g.stroke();
  drawFairy(g,190,130,1.15,1,T,b.who==='evil'?PAL_EVIL:PAL_GOOD,'idle');
  g.font='800 21px '+FONT; g.textAlign='left'; g.textBaseline='middle'; g.fillStyle=b.who==='evil'?'#d9ffd9':'#3b1d63';
  const words=b.text.split(' '); let line='', yy=b.text.length>56?91:102, lines=[];
  for(const w of words){ const t2=line?line+' '+w:w; if(g.measureText(t2).width>560&&line){ lines.push(line); line=w; } else line=t2; }
  lines.push(line); yy=102-(lines.length-1)*13;
  lines.forEach((l,i)=>g.fillText(l,226,yy+i*26));
  g.restore();
}

    drawFairy(g,480,420+bob,3.4,1,T,PAL_GOOD,'idle');
    const o=T*0.05; for(let i=0;i<8;i++) star(g,480+Math.cos(o+i*0.785)*140,300+Math.sin(o+i*0.785)*90,8,'#ffe066');
    drawBasket(g,300,430,2); drawCrown(g,680,380,2);
  }
  const txtS=INTRO[s];
  g.fillStyle='rgba(25,10,45,.85)'; rr(g,50,16,860,128,22); g.fill();
  g.font='800 26px '+FONT; g.textAlign='left'; g.textBaseline='middle'; g.fillStyle='#fff6e0';
  const words=txtS.split(' '); let line='', yy=46;
  for(const w of words){ const t2=line?line+' '+w:w; if(g.measureText(t2).width>800&&line){ g.fillText(line,80,yy); line=w; yy+=34; } else line=t2; }
  g.fillText(line,80,yy);
  g.textAlign='right'; g.font='700 16px '+FONT; g.fillStyle='#e8d9f2'; g.fillText((coarse?'Tocca':'Premi Invio o clicca')+' per continuare',930,520);
}
function updateIntro(){
  introT++;
  if(pressed.ok||pressed.jump||introT>600){
    introS++; introT=0; parts.length=0;
    if(introS>=INTRO.length){ toTitle(); }
  }
}

function drawCover(g){
  g.fillStyle='#150f2b'; g.fillRect(0,0,VW,VH);
  if(COVER.complete&&COVER.naturalWidth){ g.drawImage(COVER,0,0,VW,VH); }
  txt(g,'Sfida tra Fate',VW/2,40,46,'#ffe066');
  if(Math.floor(T/40)%2===0) txt(g,(coarse?'Tocca lo schermo':'Premi Invio o clicca')+' per iniziare',VW/2,512,24,'#fff');
}
/* ----- ciclo principale ----- */
function drawEnd(g){
  const t=winT, e=clamp(t/90,0,1), a=LV.altar;
  const ax=a.x-cam.x, ay=a.y-cam.y;
  const px=P.x+P.w/2-cam.x;
  drawBasket(g,px+(ax-20-px)*e,P.y+P.h-14-cam.y+(ay-46-(P.y+P.h-14-cam.y))*e,0.9+e*0.5);
  drawCrown(g,px+(ax+16-px)*e,P.y-6-cam.y+(ay-48-(P.y-6-cam.y))*e,0.9+e*0.5);
}
function frame(){
  T++;
  const justTapped=lastTap;
  if(mode==='cover'){ if(pressed.ok||pressed.jump){ introS=0; introT=0; setMode('intro'); } }
  else if(mode==='intro') updateIntro();
  else if(mode==='menu'||mode==='done'){ updParts(); }
  else if(mode==='play'){ updatePlay(); updParts(); if(mode==='play'||mode==='riddle') updateCam(); if(banners[0]){ if(--banners[0].t<=0) banners.shift(); } }
  else if(mode==='riddle'){ updRiddle(); }
  else if(mode==='dead'){ deadT++; updParts(); if(deadT>(easy&&LV.safe?70:110)){ if(easy&&LV.safe) respawn(); else loadLevel(LV.n,true); } }
  else if(mode==='win'){
    winT++; updParts(); updateCam();
    if(winT>60&&winT%4===0) emit(LV.altar.x+(Math.random()-.5)*200,LV.altar.y-120-Math.random()*120,5,['#ffe066','#ff7ab8','#7fd2ff','#9bff8a'][T%4],5,60,0.06);
    if(winT===300){ setMode('end'); showMenu('Il regno e\' in pace!',NOME_BUONA+' ha posato il cesto con '+basket+' frutti e la corona sulla torre piu\' alta. Evviva! Anche '+NOME_CATTIVA+' ha capito che e\' meglio essere amiche.','Rigioca',toTitle,false,false); }
  }
  for(const k in pressed) pressed[k]=false;
  lastTap=null;
  // disegno
  ctx.clearRect(0,0,VW,VH);
  if(mode==='cover') drawCover(ctx);
  else if(mode==='intro') drawIntro(ctx);
  else if(LV){
    drawWorld(ctx);
    if(mode==='play'||mode==='dead'||mode==='riddle'||mode==='win') drawHUD(ctx);
    if(mode==='win') drawEnd(ctx);
    if(mode==='play'||mode==='riddle'||mode==='win') drawBanner(ctx);
    if(mode==='dead'){
      ctx.fillStyle='rgba(20,5,40,'+Math.min(.6,deadT/60)+')'; ctx.fillRect(0,0,VW,VH);
      txt(ctx,easy&&LV.safe?'Ahi! Riproviamo da qui':'Ahi! Ricominciamo lo scenario',VW/2,VH/2,40,'#ffe9a8');
    }
    if(mode==='riddle') drawRiddle(ctx);
  }
}
let acc=0, last=performance.now();
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ frame(); acc-=1000/60; }
  requestAnimationFrame(loop);
}
setEasy(easy); loadLevel(1,false); setMode('cover');
requestAnimationFrame(loop);

</script>
