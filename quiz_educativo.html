<html lang="it">

<style>
  :root{
    --sky-top:#DCEBFF;
    --sky-bottom:#F3E9FF;
    --card:#FFFDFB;
    --ink:#3A3352;
    --purple:#8C6FD1;
    --purple-dark:#6E51B5;
    --teal:#4FBFAE;
    --teal-dark:#38A091;
    --coral:#FF9770;
    --coral-dark:#F07750;
    --gold:#FFC94D;
    --wrong:#F16B6B;
    --shadow: 0 6px 0 rgba(58,51,82,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    min-height:100vh;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:16px;
  }
  .stage{ width:100%; max-width:520px; }
  h1{
    font-family:'Fredoka', sans-serif;
    text-align:center;
    font-size:clamp(24px,6vw,32px);
    margin:6px 0 2px;
  }
  .subtitle{ text-align:center; font-weight:700; color:#6b6088; margin:0 0 16px; font-size:14px; }

  .stars-total{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:'Fredoka'; font-weight:600; font-size:14px; margin-bottom:14px;
    background:var(--card); border-radius:14px; padding:8px 12px; box-shadow:var(--shadow);
  }

  .cards{ display:flex; flex-direction:column; gap:12px; }
  .cat-card{
    background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; cursor:pointer; border:3px solid transparent;
    transition:transform .12s;
  }
  .cat-card:active{ transform:scale(0.97); }
  .cat-card.selected{ border-color:var(--purple); }
  .cat-card .emoji{ font-size:34px; }
  .cat-card .txt{ flex:1; }
  .cat-card .txt b{ font-family:'Fredoka'; font-size:17px; display:block; }
  .cat-card .txt span{ font-size:12px; color:#7a6f96; }

  .levels{ display:flex; gap:10px; margin:14px 0; }
  .lvl-btn{
    flex:1; font-family:'Fredoka'; font-weight:600; font-size:14px; border:none; border-radius:14px;
    padding:12px 6px; cursor:pointer; background:var(--card); box-shadow:var(--shadow); color:var(--ink);
  }
  .lvl-btn.active{ background:var(--purple); color:#fff; }
  .lvl-btn small{ display:block; font-weight:700; font-size:10px; opacity:.8; margin-top:2px; }

  .start-btn{
    width:100%; font-family:'Fredoka'; font-weight:600; font-size:17px; border:none; border-radius:16px;
    padding:14px; cursor:pointer; background:var(--coral); color:#fff; box-shadow:var(--shadow); margin-top:6px;
  }
  .start-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.2); }
  .start-btn:disabled{ opacity:.5; }

  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .pill{
    background:var(--card); border-radius:14px; padding:8px 12px; font-family:'Fredoka'; font-weight:600;
    font-size:13px; box-shadow:var(--shadow);
  }
  .progress-dots{ display:flex; gap:5px; justify-content:center; margin-bottom:16px; }
  .dot{ width:10px; height:10px; border-radius:50%; background:#E3DCF7; }
  .dot.done{ background:var(--teal); }
  .dot.current{ background:var(--purple); transform:scale(1.3); }

  .question-card{
    background:var(--card); border-radius:20px; padding:22px 18px; box-shadow:var(--shadow); text-align:center;
    margin-bottom:16px; min-height:70px; display:flex; align-items:center; justify-content:center;
  }
  .question-card .qtext{ font-family:'Fredoka'; font-size:clamp(18px,5vw,22px); }

  .answers{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ans-btn{
    font-family:'Nunito'; font-weight:800; font-size:15px; border:none; border-radius:16px;
    padding:16px 10px; cursor:pointer; background:var(--card); box-shadow:var(--shadow); color:var(--ink);
  }
  .ans-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }
  .ans-btn.correct{ background:var(--teal); color:#fff; }
  .ans-btn.wrong{ background:var(--wrong); color:#fff; }
  .ans-btn.disabled{ pointer-events:none; opacity:.85; }
  .ans-btn.dim{ opacity:.5; pointer-events:none; }

  .feedback{ text-align:center; font-family:'Fredoka'; font-size:15px; margin:14px 0; min-height:22px; }

  .next-btn{
    display:block; margin:0 auto; font-family:'Fredoka'; font-weight:600; font-size:15px; border:none;
    border-radius:14px; padding:12px 24px; cursor:pointer; background:var(--purple); color:#fff; box-shadow:var(--shadow);
  }

  .result-wrap{ text-align:center; }
  .result-stars{ font-size:48px; margin:10px 0; letter-spacing:6px; }
  .result-msg{ font-family:'Fredoka'; font-size:20px; margin-bottom:6px; }
  .result-score{ font-weight:800; color:#6b6088; margin-bottom:20px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .big-btn{
    font-family:'Fredoka'; font-weight:600; font-size:15px; border:none; border-radius:14px;
    padding:12px 18px; cursor:pointer; background:var(--purple); color:#fff; box-shadow:var(--shadow);
  }
  .big-btn.secondary{ background:var(--teal); }
  .big-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.2); }

  .back-link{ background:none; border:none; color:#6b6088; font-weight:800; font-size:13px; cursor:pointer; text-decoration:underline; display:block; margin:0 auto 10px; }

  .import-row{ display:flex; justify-content:center; gap:14px; margin-top:14px; flex-wrap:wrap; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px;
    font-weight:700; font-size:14px; opacity:0; transition:all .25s; pointer-events:none;
    max-width:88vw; text-align:center; z-index:70;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .back-btn{
    background:var(--card); border:none; border-radius:14px; padding:8px 12px; font-family:'Fredoka';
    font-weight:600; font-size:13px; cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
  }
  .back-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.15); }

  .loading{ text-align:center; padding:60px 0; font-family:'Fredoka'; font-size:16px; }
</style>
</head>

}

function parseQuestionsText(text){
  const lines = text.split(/\r?\n/);
  const result = {};
  let curCat = null, curLevel = null;
  let imported = 0, skipped = 0;

  lines.forEach(rawLine=>{
    const line = rawLine.trim();
    if(!line) return;

    const sectionMatch = line.match(/^##\s*([a-zA-Z]+)\s*:\s*([123])\s*$/);
    if(sectionMatch){
      const cat = sectionMatch[1].toLowerCase();
      if(!IMPORTABLE_CATEGORIES.includes(cat)){ curCat=null; curLevel=null; skipped++; return; }
      curCat = cat; curLevel = sectionMatch[2];
      if(!result[curCat]) result[curCat] = {1:[],2:[],3:[]};
      return;
    }

    if(line.startsWith('#')) return; // riga di commento

    if(!curCat){ skipped++; return; }
    const parts = line.split('|').map(p=>p.trim());
    if(parts.length!==5 || parts.some(p=>!p)){ skipped++; return; }
    const [q,c,w1,w2,w3] = parts;
    result[curCat][curLevel].push({ q, c, w:[w1,w2,w3] });
    imported++;
  });

  return { result, imported, skipped };
}

function mergeCustomBank(parsed){
  Object.keys(parsed).forEach(cat=>{
    if(!customBank[cat]) customBank[cat] = {1:[],2:[],3:[]};
    [1,2,3].forEach(lvl=>{
      const items = parsed[cat][lvl] || [];
      if(items.length) customBank[cat][lvl] = customBank[cat][lvl].concat(items);
    });
  });
}

function triggerImport(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      const { result, imported, skipped } = parseQuestionsText(ev.target.result);
      if(imported===0){
        toast('Nessuna domanda valida trovata nel file 😕');
        return;
      }
      mergeCustomBank(result);
      await saveCustomBank();
      renderHome();
      toast(`✅ ${imported} domande importate${skipped?` (${skipped} righe ignorate)`:''}`);
    };
    reader.readAsText(file);
  };
  input.click();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ---------- Math question generator ----------
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function genMathQuestion(level){
  let a,b,op,answer,text;
  if(level===1){
    op = Math.random()<0.5 ? '+' : '-';
    if(op==='+'){ a=randInt(1,8); b=randInt(1,8-0); a=randInt(1,9); b=randInt(0,9-a>=0?9-a:0); answer=a+b; }
    else { a=randInt(2,10); b=randInt(0,a); answer=a-b; }
    text = `${a} ${op} ${b} = ?`;
  } else if(level===2){
    const r = Math.random();
    if(r<0.4){ op='+'; a=randInt(5,40); b=randInt(5,40); answer=a+b; text=`${a} + ${b} = ?`; }
    else if(r<0.7){ op='-'; a=randInt(10,50); b=randInt(1,a); answer=a-b; text=`${a} - ${b} = ?`; }
    else { const table=[2,5,10][randInt(0,2)]; b=randInt(1,10); answer=table*b; text=`${table} x ${b} = ?`; }
  } else {
    const r = Math.random();
    if(r<0.45){ a=randInt(2,10); b=randInt(2,10); answer=a*b; text=`${a} x ${b} = ?`; }
    else if(r<0.75){ a=randInt(20,99); b=randInt(1,a-1); answer=a-b; text=`${a} - ${b} = ?`; }
    else { const table=randInt(2,9); const mult=randInt(1,10); const product=table*mult; answer=mult; text=`${product} : ${table} = ?`; }
  }
  const opts = new Set([answer]);
  while(opts.size<4){
    const delta = randInt(-5,5) || 1;
    const candidate = answer + delta*(randInt(1,3));
    if(candidate>=0 && candidate!==answer) opts.add(candidate);
  }
  const options = shuffle(Array.from(opts)).map(String);
  const correctIndex = options.indexOf(String(answer));
  return { text, options, correctIndex };
}

function buildQuestionSet(category, level){
  const qs = [];
  if(category==='matematica'){
    const seen = new Set();
    while(qs.length<QUESTIONS_PER_ROUND){
      const q = genMathQuestion(level);
      if(seen.has(q.text)) continue;
      seen.add(q.text);
      qs.push(q);
    }
  } else {
    let bank;
    if(category==='geografia') bank = GEO_BANK[level];
    else if(category==='lingue') bank = LANG_BANK[level];
    else if(category==='scienze') bank = SCI_BANK[level];
    else if(category==='astronomia') bank = ASTRO_BANK[level];
    const custom = (customBank[category] && customBank[category][level]) || [];
    const fullBank = bank.concat(custom);
    const picked = shuffle(fullBank).slice(0, QUESTIONS_PER_ROUND);
    picked.forEach(item=>{
      const options = shuffle([item.c, ...item.w]);
      qs.push({ text:item.q, options, correctIndex: options.indexOf(item.c) });
    });
  }
  return qs;
}

// ---------- Rendering: HOME ----------
function renderHome(){
  const catCards = Object.keys(CATEGORIES).map(key=>{
    const c = CATEGORIES[key];
    return `<div class="cat-card ${selectedCategory===key?'selected':''}" data-cat="${key}">
      <div class="emoji">${c.emoji}</div>
      <div class="txt"><b>${c.name}</b><span>${c.desc}</span></div>
    </div>`;
  }).join('');

  const levelBtns = LEVELS.map(l=>{
    const key = selectedCategory ? keyFor(selectedCategory,l.id) : null;
    const best = key ? progress.best[key] : null;
    const starsTxt = best ? '⭐'.repeat(best.stars) : '';
    return `<button class="lvl-btn ${selectedLevel===l.id?'active':''}" data-lvl="${l.id}">${l.name}<small>${starsTxt||'&nbsp;'}</small></button>`;
  }).join('');

  stageEl.innerHTML = `
    <h1>🧠 Quiz Curioso</h1>
    <p class="subtitle">Matematica, geografia e lingue: mettiti alla prova!</p>
    <div class="stars-total">⭐ Stelle totali raccolte: ${progress.totalStars}</div>
    <div class="cards">${catCards}</div>
    ${selectedCategory ? `<div class="levels">${levelBtns}</div>` : ''}
    <button class="start-btn" id="startBtn" ${selectedCategory?'':'disabled'}>Inizia il quiz! 🚀</button>
    <div class="import-row">
      <button class="link-btn" id="downloadTemplateBtn">📄 Scarica modello domande</button>
      <button class="link-btn" id="importBtn">📥 Importa domande da file</button>
    </div>
  `;

  document.querySelectorAll('.cat-card').forEach(el=>{
    el.onclick = ()=>{ selectedCategory = el.dataset.cat; renderHome(); };
  });
  document.querySelectorAll('.lvl-btn').forEach(el=>{
    el.onclick = ()=>{ selectedLevel = parseInt(el.dataset.lvl,10); renderHome(); };
  });
  const startBtn = document.getElementById('startBtn');
  if(startBtn && selectedCategory){
    startBtn.onclick = ()=> startSession(selectedCategory, selectedLevel);
  }
  document.getElementById('downloadTemplateBtn').onclick = downloadTemplate;
  document.getElementById('importBtn').onclick = triggerImport;
}

// ---------- Session flow ----------
function startSession(category, level){
  session = {
    category, level,
    questions: buildQuestionSet(category, level),
    idx: 0,
    correctCount: 0,
    answered:false
  };
  view='quiz';
  renderQuiz();
}

function renderQuiz(){
  const q = session.questions[session.idx];
  const dots = session.questions.map((_,i)=>{
    let cls='dot';
    if(i<session.idx) cls+=' done';
    else if(i===session.idx) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  stageEl.innerHTML = `
    <div class="top-row">
      <button class="back-btn" id="backBtn">← Indietro</button>
      <div class="pill">${CATEGORIES[session.category].emoji} ${CATEGORIES[session.category].name}</div>
      <div class="pill">✅ ${session.correctCount}/${session.questions.length}</div>
    </div>
    <div class="progress-dots">${dots}</div>
    <div class="question-card"><div class="qtext">${q.text}</div></div>
    <div class="answers" id="answers">
      ${q.options.map((opt,i)=>`<button class="ans-btn" data-i="${i}">${opt}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <div id="nextWrap" style="text-align:center; min-height:48px;"></div>
  `;

  document.getElementById('backBtn').onclick = ()=>{ view='home'; renderHome(); };

  document.querySelectorAll('.ans-btn').forEach(btn=>{
    btn.onclick = ()=> onAnswer(parseInt(btn.dataset.i,10));
  });
}

const CHEERS_RIGHT = ['Bravissima! 🎉','Esatto! ✨','Perfetto! 🌟','Ottimo lavoro! 👏'];
const CHEERS_WRONG = ['Quasi! Riprova la prossima 💪','Non preoccuparti, si impara così! 🌱','Andiamo avanti insieme! 😊'];

function onAnswer(i){
  if(session.answered) return;
  session.answered = true;
  const q = session.questions[session.idx];
  const buttons = document.querySelectorAll('.ans-btn');
  const feedback = document.getElementById('feedback');
  const isCorrect = i===q.correctIndex;

  buttons.forEach((btn,idx)=>{
    btn.classList.add('disabled');
    if(idx===q.correctIndex) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if(isCorrect){
    session.correctCount++;
    feedback.textContent = CHEERS_RIGHT[Math.floor(Math.random()*CHEERS_RIGHT.length)];
  } else {
    feedback.textContent = CHEERS_WRONG[Math.floor(Math.random()*CHEERS_WRONG.length)];
  }

  const isLast = session.idx === session.questions.length-1;
  document.getElementById('nextWrap').innerHTML =
    `<button class="next-btn" id="nextBtn">${isLast?'Vedi risultato 🏁':'Avanti ➡️'}</button>`;
  document.getElementById('nextBtn').onclick = ()=>{
    if(isLast) finishSession();
    else { session.idx++; session.answered=false; renderQuiz(); }
  };
}

function starsFor(correct,total){
  const pct = correct/total;
  if(pct>=0.875) return 3;
  if(pct>=0.625) return 2;
  if(pct>=0.375) return 1;
  return 0;
}

function finishSession(){
  const total = session.questions.length;
  const stars = starsFor(session.correctCount, total);
  const key = keyFor(session.category, session.level);
  const prevBest = progress.best[key];
  if(!prevBest || session.correctCount > prevBest.correct){
    progress.best[key] = { correct: session.correctCount, total, stars };
  } else if(stars > (prevBest.stars||0)){
    progress.best[key].stars = stars;
  }
  saveProgress();
  view='result';
  renderResult(stars, total);
}

function renderResult(stars, total){
  const starIcons = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  let msg;
  if(stars===3) msg = 'Straordinario! Sei una vera esperta! 🏆';
  else if(stars===2) msg = 'Bravissima, continua così! 🎈';
  else if(stars===1) msg = 'Bel lavoro, ci sei quasi! 🌼';
  else msg = 'Hai iniziato benissimo, riprova quando vuoi! 🌱';

  stageEl.innerHTML = `
    <div class="result-wrap">
      <h1>${CATEGORIES[session.category].emoji} Risultato</h1>
      <div class="result-stars">${starIcons}</div>
      <div class="result-msg">${msg}</div>
      <div class="result-score">Risposte corrette: ${session.correctCount} su ${total}</div>
      <div class="result-actions">
        <button class="big-btn" id="retryBtn">🔁 Rigioca</button>
        <button class="big-btn secondary" id="homeBtn">🏠 Cambia materia</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=> startSession(session.category, session.level);
  document.getElementById('homeBtn').onclick = ()=>{ view='home'; renderHome(); };
}

// ---------- Init ----------
(async function init(){
  progress = await loadProgress();
  customBank = await loadCustomBank();
  renderHome();
})();

})();
</script>
